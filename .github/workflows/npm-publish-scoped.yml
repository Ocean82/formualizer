# Fork-only: publishes @ocean8219/formualizer using NPM_TOKEN.
# Prefer this over upstream npm-publish.yml / release.yml for the scoped package.
# workflow_dispatch must live on the default branch (main).
name: Publish scoped npm

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref with the scoped package overlay (usually release/smartsht)
        required: true
        default: release/smartsht
      package_dir:
        description: Directory containing the npm package
        required: true
        default: bindings/wasm

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package (bundler)
        working-directory: ${{ inputs.package_dir }}
        run: |
          wasm-pack build --target bundler --out-dir pkg --release
          if [ -f scripts/remove-generated-gitignore.mjs ]; then
            node scripts/remove-generated-gitignore.mjs
          else
            rm -f pkg/.gitignore
          fi

      - name: Install JS dependencies
        working-directory: ${{ inputs.package_dir }}
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build TS wrapper
        working-directory: ${{ inputs.package_dir }}
        run: pnpm run build:ts

      - name: Publish to npm
        working-directory: ${{ inputs.package_dir }}
        run: npm publish --ignore-scripts --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
